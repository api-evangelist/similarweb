aid: similarweb
name: SimilarWeb
description: >-
  SimilarWeb is a digital intelligence platform offering a REST API for accessing
  website traffic estimates, audience demographics, keyword analytics, competitive
  benchmarking, app intelligence data, and lead generation insights. The API
  provides real-time and historical data covering traffic sources, search behavior,
  technographics, e-commerce shopper intelligence, and firmographic company data,
  enabling developers to integrate market intelligence into applications,
  dashboards, and data pipelines. The current generation is API V5, launched March 2026,
  which unified the REST and Batch API keys, added multi-metric requests, and shipped a
  first-party hosted MCP server at mcp.similarweb.com for AI agents; legacy v1-v4 REST
  endpoints carry a published sunset date of 2026-10-06.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
