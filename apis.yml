apis:
- aid: similarweb:similarweb-batch-api
  name: SimilarWeb Batch API
  description: >-
    The SimilarWeb Batch API is optimized for large-scale bulk data extraction, supporting jobs of up
    to one million domains per request. It delivers data asynchronously to cloud storage destinations
    including Amazon S3, Google Cloud Storage, and Snowflake. It is ideal for historical analysis, data
    warehouse ingestion, and large-scale competitive research workflows.
