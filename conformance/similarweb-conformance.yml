description: >-
  Which cross-cutting standards the Similarweb surface actually conforms to. The notable
  split: the REST/Batch API conforms to almost nothing beyond OpenAPI-describable HTTP —
  no OAuth, no RFC 9457, no RFC 8594, no security.txt — while the MCP surface is a
  standards-clean implementation with RFC 9728 protected-resource metadata, RFC 8414
  authorization-server metadata, PKCE and RFC 7591 dynamic client registration.

