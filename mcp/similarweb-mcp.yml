description: >-
  Similarweb operates a first-party hosted (remote) MCP server at https://mcp.similarweb.com
  that exposes its Web, Search and App intelligence datasets as MCP tools. It is not an npm
  or PyPI package — there is nothing to install; an MCP client POSTs directly to the HTTPS
  endpoint. Access requires an active Similarweb subscription that includes API access
  (API-only, Business or Enterprise) and an API key generated from Settings > Account in the
  Similarweb platform. Similarweb is also listed as an official connector in Claude's
  Connectors Directory.

deployment:
  mode: remote
  endpoint: https://mcp.similarweb.com
  auth: api-key
  verified: probed
  note: >-
    Endpoint taken verbatim from the provider's MCP setup guide, then probed. An anonymous
    POST of tools/list returns HTTP 401 with
    {"error":"invalid_request","error_description":"Authentication required. Provide either
    'api-key' header or 'Authorization: Bearer <token>' header."} — so the server is live and
    auth-gated. Two credential paths are supported: a Similarweb API key in an `api-key`
    header, or an OAuth 2.1 bearer token issued by https://mcp-auth.similarweb.com (see
    well-known/similarweb-oauth-protected-resource.json). No stdio/npx package is published.

transport:
  type: http
  url: https://mcp.similarweb.com
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    result: auth-gated
    date: '2026-08-13'

authorization:
  api_key:
    header: api-key
    obtained_from: https://account.similarweb.com/standard-api
  oauth2:
    protected_resource_metadata: https://mcp.similarweb.com/.well-known/oauth-protected-resource
    authorization_server: https://mcp-auth.similarweb.com
    metadata: https://mcp-auth.similarweb.com/.well-known/oauth-authorization-server
    scopes_supported: [read]
    grant_types: [authorization_code, refresh_token]
    pkce: [S256, plain]
    dynamic_client_registration: https://mcp-auth.similarweb.com/register

clients_documented:
