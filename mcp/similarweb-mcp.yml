billing:
  model: data-credits
  note: >-
    MCP calls consume the same data credits as REST API calls; consumption varies with the
    prompt and which datasets the agent reaches for.
  source: https://docs.similarweb.com/api-v5/similarweb-mcp/mcp-setup

tools_source: >-
  tools/list is auth-gated, so the live inputSchema for each tool could not be introspected.
  The tool list below is transcribed verbatim from the provider-published "Available Metrics"
  tables in the MCP setup guide (names + descriptions + returned metrics only). Input schemas
  require authenticated introspection — do not treat the fields below as a parameter contract.

tools:
- {name: Traffic and Engagement, category: web, description: Get traffic and engagement metrics over time for a specific website, metrics: [visits, average_visit_duration, pages_per_visit, bounce_rate, page_views, unique_visitors, new_users, returning_users]}
- {name: Traffic Sources, category: web, description: 'Get traffic metrics broken down by marketing channels (direct, display ads, mail, organic search, paid search, referrals, and social)', metrics: [visits, average_visit_duration, pages_per_visit, bounce_rate]}
- {name: Website Rank, category: web, description: Get website rank over time for a specific website, metrics: [country_rank, category, category_rank]}
- {name: Subdomains, category: web, description: Get subdomain traffic share data for a website, metrics: [subdomain, share]}
