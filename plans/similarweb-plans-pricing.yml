  Similarweb publishes NO list price for API access. All three tiers below are named on the
  provider's own API page and pricing collateral, but every one of them routes to "contact
  sales" — there is no self-serve API checkout, no published per-credit rate and no
  published credit allocation. The tier names and their gating (API access is included in
