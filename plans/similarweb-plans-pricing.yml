notes:
  - Data credits are consumed per API call based on the endpoint and data volume returned.
  - Use the Request Validate endpoint to estimate credit cost before executing large queries.
  - No credits are charged for rate-limit errors (HTTP 429).
  - Credit quotas reset monthly.
  - >-
    UNPUBLISHED PRICE. A commonly cited range of roughly $500/month at entry level to
    $20,000+/month for high-volume enterprise use is a market observation, NOT a
    Similarweb-published figure. Similarweb lists no price for API access anywhere on its
    site.
  - All plans require contacting the SimilarWeb sales team for a custom quote.
  - >-
    Credit cost formula published by the provider: number of domains x endpoint price x
    granularity x number of country filters x historical range x number of results
    requested.
  - >-
    Up to 7 years of historical data is available across all data types, with the exact
    range set by the subscription; confirm it per account with the Check Capabilities
    operation.
  - MCP server calls draw on the same data credits as REST calls.

