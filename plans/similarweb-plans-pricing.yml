name: SimilarWeb API Plans & Pricing
description: >-
  SimilarWeb API pricing is based on a data credit model — customers pay for
  the data returned, not simply for API calls made. API access is available
  as part of Business and Enterprise platform plans, or as a standalone API
  package. Pricing is customized based on endpoint access, data credit volume,
  number of users, and contract term. Public list prices are not published;
  prospective customers must request a quote from the sales team.
