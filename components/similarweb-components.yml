description: >-
  Similarweb ships no embeddable web components or JavaScript element library. What it
  ships instead — and what fills the gap left by the absence of any first-party SDK — is a
  set of prebuilt destination connectors and spreadsheet/BI add-ins that consume the same
  API key and the same data credits. They are grouped below by family. This is a
  no-code/low-code surface, not a client-side UI kit, and it is recorded as such.

