  - {name: Salesforce integration, docs: 'https://docs.similarweb.com/api-v5/batch-api-general/batch-api-integrations/salesforce-connector'}

- family: Cloud and data-platform destinations
  description: >-
    Batch API delivery targets. These are configured through the Integrations operations in
    openapi/similarweb-integrations-api-openapi.yml, so unlike the rest of this file they
