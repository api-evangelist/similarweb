  - {name: Google Cloud Storage, operation: createGcsIntegration, docs: 'https://docs.similarweb.com/api-v5/batch-api-general/batch-api-integrations/google-cloud-storage-gcs-post'}
  - {name: Snowflake, docs: 'https://docs.similarweb.com/api-v5/batch-api-general/batch-api-integrations/snowflake-api-integration'}
  - {name: Databricks}

- family: Browser extension
  description: Consumer/analyst surface, not a developer component
  components:
  - {name: Similarweb Browser Extension, url: 'https://www.similarweb.com/corp/browser-extension/'}

