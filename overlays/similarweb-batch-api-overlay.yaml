- target: $
  description: >-
    The Batch 429 is a limit on PENDING jobs, not the REST 10-requests-per-second limit.
    Conflating the two is the most likely integration error on this surface.
  update:
    x-rate-limit:
      kind: pending-job-concurrency
      status_on_exhaustion: 429
      distinct_from: the REST 10 rps limit
      docs: https://docs.similarweb.com/api-v5/guides/error-handling-and-troubleshooting

- target: $.components.schemas.WebhookSubscribeRequest
