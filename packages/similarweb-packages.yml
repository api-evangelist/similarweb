description: >-
  Similarweb publishes NO first-party client library for its API in any public package
  registry. The developer docs contain no SDK page and no install command — the documented
  integration paths are raw HTTP with an `api-key` header, the hosted MCP server, and the
  no-code connectors (Excel, Looker Studio, Salesforce, HubSpot) catalogued in
  components/similarweb-components.yml. The github.com/similarweb organisation was reviewed
  in full (53 public repositories, 2026-08-13): every repository is internal platform or
  DevOps tooling (statusbay, finala, bbox, homebrew-tap, linq2fb) or a fork of a third-party
  library. None is an API client. The entries below are therefore all community-maintained,
  all unofficial, and all stale — the newest first-party-adjacent thing a developer can
  install is an n8n community node, and the language clients date to 2016.

