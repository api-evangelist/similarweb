description: >-
  Entity-relationship graph derived from the 28 component schemas across the two Similarweb
  OpenAPI documents. The shape is unusual and worth stating plainly: the REST API is not a
  resource API. It has no persisted entities, no ids and no CRUD — every REST response is a
  measurement of an EXTERNAL subject (a domain, a keyword, an app, a country) wrapped in a
  common `meta` envelope. The only real stateful entities Similarweb owns live on the Batch
  side: Report, Integration and WebhookSubscription, each with its own identifier.

